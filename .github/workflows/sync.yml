name: Sync placar (openfootball)

# Atualiza jogos/placares reais no Supabase a cada 10 min (Copa ao vivo).
# Requer SÓ 1 secret no repo: SUPABASE_SERVICE_ROLE_KEY (a URL é pública, embutida abaixo).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-placar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund @supabase/supabase-js
      - name: Sincronizar
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ajygmjgbljdkogvijecl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-openfootball.mjs
